<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 生存游戏 - 简笔画动画 Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #e8e4dc;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  canvas { border-radius: 8px; box-shadow: 0 2px 20px rgba(0,0,0,0.15); }
</style>
</head>
<body>
<canvas id="c" width="960" height="720"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let time = 0;

// 用固定种子的抖动，不然每帧都抖就成PPT了
const jitCache = {};
function jitS(id, amp) {
  if (!jitCache[id]) jitCache[id] = (Math.sin(id * 127.1) * 43758.5) % 1 * amp - amp/2;
  return jitCache[id];
}
// 动态抖动（缓慢摆动）
function wobble(id, amp, speed) {
  return Math.sin(time * speed + id * 3.7) * amp;
}

const INK = '#3a3a3a';
const INK_L = '#8a8a8a';
const PAPER = '#f5f1e8';
const PAPER_LINE = '#d8d4cc';
const PEACH = '#ffe8d0';
const BLUSH = 'rgba(240,140,140,0.35)';
const RED_B = 'rgba(220,70,80,0.6)';

// ========== 手绘基础 ==========
function sketchLine(x1,y1,x2,y2,id) {
  const s = Math.max(3, Math.floor(Math.hypot(x2-x1,y2-y1)/8));
  ctx.beginPath();
  ctx.moveTo(x1+jitS(id,1), y1+jitS(id+1,1));
  for (let i=1;i<=s;i++) {
    const t=i/s;
    ctx.lineTo(x1+(x2-x1)*t+jitS(id+i*2,1), y1+(y2-y1)*t+jitS(id+i*2+1,1));
  }
  ctx.stroke();
}

function sketchCircle(x,y,r,fill,id) {
  id = id||0;
  ctx.beginPath();
  for (let i=0;i<=48;i++) {
    const a=(i/48)*Math.PI*2;
    const rr=r+jitS(id+i,1);
    const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  if(fill){ctx.fill();ctx.stroke();}else ctx.stroke();
}

function sketchEllipse(x,y,rx,ry,fill,id) {
  id=id||0;
  ctx.beginPath();
  for(let i=0;i<=48;i++){
    const a=(i/48)*Math.PI*2;
    const px=x+Math.cos(a)*(rx+jitS(id+i,0.6));
    const py=y+Math.sin(a)*(ry+jitS(id+i+50,0.6));
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();
  if(fill){ctx.fill();ctx.stroke();}else ctx.stroke();
}

function sketchArc(x,y,r,sa,ea,id) {
  id=id||0;
  ctx.beginPath();
  for(let i=0;i<=20;i++){
    const a=sa+(ea-sa)*(i/20);
    const rr=r+jitS(id+i,0.6);
    const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.stroke();
}

// ========== 背景（静态缓存） ==========
let bgCache = null;
function drawBgToCache() {
  const oc = document.createElement('canvas');
  oc.width = cv.width; oc.height = cv.height;
  const ox = oc.getContext('2d');

  // 纸
  ox.fillStyle = PAPER;
  ox.fillRect(0,0,oc.width,oc.height);
  // 噪点
  for(let i=0;i<3000;i++){
    ox.fillStyle=`rgba(0,0,0,${Math.random()*0.02})`;
    ox.fillRect(Math.random()*oc.width,Math.random()*oc.height,1,1);
  }
  // 网格
  ox.strokeStyle=PAPER_LINE; ox.lineWidth=0.5;
  for(let x=0;x<oc.width;x+=32){ox.beginPath();ox.moveTo(x,0);ox.lineTo(x,oc.height);ox.stroke();}
  for(let y=0;y<oc.height;y+=32){ox.beginPath();ox.moveTo(0,y);ox.lineTo(oc.width,y);ox.stroke();}

  // 地形色块
  ox.fillStyle='rgba(120,180,100,0.15)';
  ox.beginPath();ox.moveTo(0,250);ox.quadraticCurveTo(200,220,380,280);
  ox.quadraticCurveTo(450,350,420,500);ox.quadraticCurveTo(350,650,200,700);
  ox.lineTo(0,720);ox.closePath();ox.fill();

  ox.fillStyle='rgba(100,160,80,0.25)';
  ox.beginPath();ox.moveTo(300,100);ox.quadraticCurveTo(500,80,580,200);
  ox.quadraticCurveTo(600,350,500,450);ox.quadraticCurveTo(380,400,300,350);
  ox.quadraticCurveTo(250,250,300,100);ox.closePath();ox.fill();

  ox.fillStyle='rgba(180,140,90,0.15)';
  ox.beginPath();ox.moveTo(600,0);ox.lineTo(960,0);ox.lineTo(960,400);
  ox.quadraticCurveTo(850,450,700,350);ox.quadraticCurveTo(580,250,600,100);
  ox.closePath();ox.fill();

  // 河
  ox.fillStyle='rgba(100,170,220,0.2)';
  ox.beginPath();ox.moveTo(650,0);ox.quadraticCurveTo(630,150,660,300);
  ox.quadraticCurveTo(680,450,640,600);ox.quadraticCurveTo(620,680,640,720);
  ox.lineTo(690,720);ox.quadraticCurveTo(680,680,700,600);
  ox.quadraticCurveTo(730,450,710,300);ox.quadraticCurveTo(690,150,700,0);
  ox.closePath();ox.fill();

  // 湖
  ox.beginPath();ox.ellipse(470,180,50,30,-0.2,0,Math.PI*2);ox.fill();

  // 区域标注
  ox.fillStyle=INK_L;ox.font='italic 13px Georgia,serif';
  ox.fillText('~ 安全草地 ~',80,540);
  ox.fillText('~ 森林 ~',380,250);
  ox.fillText('~ 山地 ~',780,120);
  ox.save();ox.translate(720,350);ox.rotate(Math.PI/2);ox.fillText('~ 河流 ~',0,0);ox.restore();

  bgCache = oc;
}

// ========== 树（会轻微摇摆） ==========
function drawTree(x,y,size,id) {
  const sw = wobble(id, 0.03, 0.8);
  ctx.save();
  ctx.translate(x, y + size*1.5);
  ctx.rotate(sw);
  ctx.translate(-x, -(y + size*1.5));

  ctx.strokeStyle=INK;ctx.lineWidth=1.5;
  ctx.fillStyle='rgba(100,170,80,0.12)';
  sketchLine(x,y,x-1,y+size*1.5,id);
  sketchLine(x+4,y+2,x+3,y+size*1.5,id+10);
  sketchCircle(x+1,y-size*0.3,size,true,id+20);
  ctx.fillStyle='rgba(100,170,80,0.08)';
  sketchCircle(x-size*0.5,y,size*0.7,true,id+30);
  sketchCircle(x+size*0.6,y+1,size*0.65,true,id+40);

  ctx.restore();
}

function drawGrass(x,y,id) {
  const sw = wobble(id, 2, 1.5);
  ctx.strokeStyle=INK_L;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x-3+sw,y-8,x-2+sw,y-12);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+2,y);ctx.quadraticCurveTo(x+4+sw,y-9,x+6+sw,y-11);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+1,y);ctx.quadraticCurveTo(x+1+sw*0.5,y-10,x+1+sw*0.5,y-14);ctx.stroke();
}

function drawRock(x,y,size,id) {
  ctx.strokeStyle=INK;ctx.lineWidth=1.5;
  ctx.fillStyle='rgba(160,160,160,0.1)';
  ctx.beginPath();
  const pts=[];
  for(let i=0;i<7;i++){
    const a=(i/7)*Math.PI*2-0.3;
    const r=size*(0.7+Math.abs(jitS(id+i*10,0.8)));
    pts.push([x+Math.cos(a)*r,y+Math.sin(a)*r*0.6]);
  }
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle=INK_L;ctx.lineWidth=0.8;
  sketchLine(x-size*0.2,y-size*0.1,x+size*0.1,y+size*0.15,id+50);
}

function drawBerryBush(x,y,id) {
  const sw = wobble(id, 1.5, 1);
  ctx.strokeStyle=INK;ctx.lineWidth=1.3;
  ctx.fillStyle='rgba(100,160,80,0.12)';
  sketchEllipse(x+sw*0.5,y,14,10,true,id);
  ctx.fillStyle=RED_B;ctx.strokeStyle=INK;ctx.lineWidth=1;
  sketchCircle(x-5+sw,y-3,3,true,id+10);
  sketchCircle(x+4+sw,y-1,3,true,id+20);
  sketchCircle(x-1+sw*0.5,y+3,2.5,true,id+30);
}

// ========== 篝火（火焰动画） ==========
function drawCampfire(x,y) {
  ctx.strokeStyle=INK;ctx.lineWidth=1.3;
  sketchLine(x-10,y+4,x+10,y+2,5000);
  sketchLine(x-8,y+1,x+8,y+5,5010);

  const flicker1 = wobble(1, 3, 4);
  const flicker2 = wobble(2, 2, 5);
  const fh = 18 + wobble(3, 3, 3);

  ctx.fillStyle='rgba(240,160,50,0.15)';
  ctx.beginPath();
  ctx.moveTo(x-6,y+2);
  ctx.quadraticCurveTo(x-8+flicker1,y-10,x+flicker2,y-fh);
  ctx.quadraticCurveTo(x+8+flicker1,y-10,x+6,y+2);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=INK;ctx.lineWidth=1.3;ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x-3,y+1);
  ctx.quadraticCurveTo(x-1+flicker2,y-5,x+flicker1*0.3,y-fh*0.55);
  ctx.quadraticCurveTo(x+2-flicker2,y-5,x+3,y+1);
  ctx.closePath();ctx.stroke();

  // 火星
  const sparkY = y - fh - 5 + wobble(10, 4, 2);
  const sparkX = x + flicker1 * 0.8;
  ctx.fillStyle = INK_L;
  ctx.beginPath(); ctx.arc(sparkX-3, sparkY, 0.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sparkX+4, sparkY-3, 0.6, 0, Math.PI*2); ctx.fill();
}

function drawShelter(x,y) {
  ctx.strokeStyle=INK;ctx.lineWidth=1.5;
  ctx.fillStyle='rgba(180,140,80,0.1)';
  ctx.beginPath();
  ctx.moveTo(x-20,y+15);ctx.lineTo(x-20,y-5);ctx.lineTo(x,y-22);
  ctx.lineTo(x+20,y-5);ctx.lineTo(x+20,y+15);ctx.closePath();
  ctx.fill();ctx.stroke();
  sketchLine(x-4,y+15,x-4,y+2,6000);
  sketchLine(x+4,y+15,x+4,y+2,6010);
  sketchLine(x-4,y+2,x+4,y+2,6020);
  ctx.fillStyle=INK;
  ctx.beginPath();ctx.arc(x+2,y+9,1.2,0,Math.PI*2);ctx.fill();
}

// ========== AI 角色 ==========
function drawAI(x,y,expr,scale) {
  const sc = scale||1;
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(sc,sc);

  // 呼吸动画
  const breath = wobble(99, 0.5, 2);

  ctx.strokeStyle=INK;ctx.lineWidth=1.8/sc;

  // 影子
  ctx.fillStyle='rgba(0,0,0,0.06)';
  ctx.beginPath();ctx.ellipse(0,22,14+breath,4,0,0,Math.PI*2);ctx.fill();

  // 身体（随呼吸微动）
  ctx.fillStyle=PEACH;
  sketchEllipse(0,14+breath*0.5,7,5+breath*0.3,true,8000);

  // 小手（走路时摆动）
  const armSwing = wobble(77, 8, 3);
  ctx.strokeStyle=INK;ctx.lineWidth=1.5/sc;
  // 左手
  sketchLine(-7, 12, -12 + armSwing*0.5, 18 + Math.abs(armSwing)*0.3, 8100);
  // 右手
  sketchLine(7, 12, 12 - armSwing*0.5, 18 - Math.abs(armSwing)*0.3, 8110);

  // 小脚（走路时交替）
  const legSwing = wobble(88, 3, 3);
  ctx.lineWidth = 1.5/sc;
  sketchLine(-3, 19, -4 + legSwing, 24, 8120);
  sketchLine(3, 19, 4 - legSwing, 24, 8130);

  // 脸
  ctx.lineWidth=1.8/sc;
  ctx.fillStyle=PEACH;
  sketchCircle(0,0,16-breath*0.2,true,8050);

  // 腮红
  ctx.fillStyle=BLUSH;
  ctx.beginPath();ctx.arc(-11,3,3.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(11,3,3.5,0,Math.PI*2);ctx.fill();

  ctx.fillStyle=INK;ctx.strokeStyle=INK;

  switch(expr){
    case 'normal':
      ctx.beginPath();ctx.arc(-5,-2,1.8,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(5,-2,1.8,0,Math.PI*2);ctx.fill();
      ctx.lineWidth=1.5/sc;
      sketchLine(-4,6,4,6,8060);
      break;
    case 'scared':
      ctx.lineWidth=1.5/sc;
      sketchCircle(-5,-2,3.5,false,8061);
      sketchCircle(5,-2,3.5,false,8062);
      ctx.beginPath();ctx.arc(-5,-2,1.2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(5,-2,1.2,0,Math.PI*2);ctx.fill();
      ctx.lineWidth=1.3/sc;
      ctx.beginPath();
      ctx.moveTo(-4,5);ctx.lineTo(4,5);ctx.lineTo(0,10);ctx.closePath();ctx.stroke();
      // 汗滴
      ctx.strokeStyle=INK_L;ctx.lineWidth=1/sc;
      const sweatY = wobble(200, 2, 3);
      ctx.beginPath();ctx.moveTo(17,-8+sweatY);ctx.quadraticCurveTo(18,-5+sweatY,17,-2+sweatY);ctx.stroke();
      ctx.strokeStyle=INK;
      break;
    case 'happy':
      ctx.lineWidth=1.8/sc;
      sketchArc(-5,-1,3.5,Math.PI,0,8063);
      sketchArc(5,-1,3.5,Math.PI,0,8064);
      ctx.lineWidth=1.5/sc;
      sketchArc(0,4,5,0.1,Math.PI-0.1,8065);
      break;
    case 'thinking':
      ctx.beginPath();ctx.arc(-5,-2,1.8,0,Math.PI*2);ctx.fill();
      ctx.lineWidth=1.5/sc;
      sketchLine(3,-2,7,-2,8066);
      ctx.beginPath();
      ctx.moveTo(-4,6);ctx.quadraticCurveTo(-1,3,1,6);ctx.quadraticCurveTo(3,9,5,6);
      ctx.stroke();
      break;
    case 'curious':
      ctx.beginPath();ctx.arc(-5,-2,2.2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(5,-2,2.2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(-4,-3,0.9,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(6,-3,0.9,0,Math.PI*2);ctx.fill();
      ctx.lineWidth=1.3/sc;
      sketchCircle(0,6,2.5,false,8067);
      break;
    case 'determined':
      ctx.lineWidth=1.5/sc;
      sketchLine(-7,-4,-4,-1,8068);sketchLine(-4,-1,-7,2,8069);
      sketchLine(7,-4,4,-1,8070);sketchLine(4,-1,7,2,8071);
      sketchLine(-3,7,3,7,8072);
      break;
  }

  ctx.restore();
}

// ========== 兔子（蹦蹦跳跳） ==========
const rabbits = [
  { x:150, y:430, vx:0.3, phase:0 },
  { x:300, y:560, vx:-0.2, phase:2 },
];

function updateRabbit(r) {
  r.x += r.vx;
  r.phase += 0.05;
  if (r.x > 350 || r.x < 100) r.vx *= -1;
}

function drawRabbit(r) {
  const hop = Math.abs(Math.sin(r.phase * 3)) * 5;
  const x = r.x, y = r.y - hop;
  const flip = r.vx < 0 ? -1 : 1;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip, 1);

  ctx.strokeStyle=INK;ctx.lineWidth=1.3;
  ctx.fillStyle='rgba(220,200,170,0.15)';
  sketchEllipse(0,3,6,4.5,true,3000);
  sketchCircle(0,-4,5,true,3010);

  // 耳朵（跳时微动）
  const earBounce = hop * 0.3;
  ctx.fillStyle='rgba(240,180,180,0.15)';
  sketchEllipse(-3,-14-earBounce,2,5,true,3020);
  sketchEllipse(3,-14-earBounce,2,5,true,3030);

  ctx.fillStyle=INK;
  ctx.beginPath();ctx.arc(-2,-5,1,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(2,-5,1,0,Math.PI*2);ctx.fill();

  ctx.restore();
}

// ========== 狼（缓慢巡逻） ==========
const wolves = [
  { x:760, y:400, vx:-0.15, phase:0 },
  { x:830, y:320, vx:0.1, phase:1 },
];

function updateWolf(w) {
  w.x += w.vx;
  w.phase += 0.02;
  if (w.x > 880 || w.x < 700) w.vx *= -1;
}

function drawWolf(w) {
  const x = w.x, y = w.y;
  const flip = w.vx < 0 ? -1 : 1;

  ctx.save();
  ctx.translate(x,y);
  ctx.scale(flip,1);

  ctx.strokeStyle=INK;ctx.lineWidth=1.5;
  ctx.fillStyle='rgba(120,120,130,0.2)';
  sketchEllipse(0,3,10,6,true,4000);
  sketchCircle(0,-6,7,true,4010);

  // 尖耳
  ctx.beginPath();ctx.moveTo(-6,-8);ctx.lineTo(-3,-18);ctx.lineTo(0,-8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(3,-18);ctx.lineTo(6,-8);ctx.stroke();

  // 凶狠眼
  ctx.lineWidth=1.5;
  sketchLine(-5,-8,-2,-5,4020);
  sketchLine(5,-8,2,-5,4030);
  ctx.fillStyle=INK;
  ctx.beginPath();ctx.arc(-3,-6,1.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(3,-6,1.3,0,Math.PI*2);ctx.fill();

  // 尾巴摇动
  const tailWag = wobble(w.phase * 100, 5, 2);
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(-10, 1);
  ctx.quadraticCurveTo(-18, -5 + tailWag, -15, -10 + tailWag);
  ctx.stroke();

  ctx.lineWidth=1;
  sketchLine(-3,-1,0,0,4040);sketchLine(0,0,3,-1,4050);

  ctx.restore();
}

// ========== 鹿（悠闲吃草） ==========
const deers = [
  { x:420, y:420, headY: 0, eating: false, timer: 0 },
];

function updateDeer(d) {
  d.timer++;
  if (d.timer % 120 === 0) d.eating = !d.eating;
  d.headY += (d.eating ? 8 : 0 - d.headY) * 0.05;
}

function drawDeer(d) {
  const x=d.x, y=d.y;
  ctx.strokeStyle=INK;ctx.lineWidth=1.3;
  ctx.fillStyle='rgba(200,160,110,0.12)';
  sketchEllipse(x,y+2,8,5,true,5000);
  sketchCircle(x,y-6+d.headY,5.5,true,5010);

  ctx.fillStyle='rgba(230,215,190,0.15)';
  sketchEllipse(x,y+5,4.5,2.5,true,5015);

  ctx.lineWidth=1.5;
  const antlerSway = wobble(55, 1, 0.5);
  sketchLine(x-3,y-10+d.headY,x-6+antlerSway,y-20+d.headY,5020);
  sketchLine(x-6+antlerSway,y-17+d.headY,x-9+antlerSway,y-15+d.headY,5030);
  sketchLine(x+3,y-10+d.headY,x+6-antlerSway,y-20+d.headY,5040);
  sketchLine(x+6-antlerSway,y-17+d.headY,x+9-antlerSway,y-15+d.headY,5050);

  ctx.fillStyle=INK;
  ctx.beginPath();ctx.arc(x-2,y-7+d.headY,1.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+2,y-7+d.headY,1.2,0,Math.PI*2);ctx.fill();
}

// ========== 鱼（水里游） ==========
const fishes = [
  { x:660, y:300, vx: 0.4, phase: 0 },
  { x:680, y:450, vx: -0.3, phase: 1.5 },
];

function updateFish(f) {
  f.x += f.vx;
  f.phase += 0.03;
  if (f.x > 700 || f.x < 640) f.vx *= -1;
}

function drawFish(f) {
  const x=f.x, y=f.y + Math.sin(f.phase*2)*3;
  const flip = f.vx < 0 ? -1 : 1;
  ctx.save();ctx.translate(x,y);ctx.scale(flip,1);

  ctx.strokeStyle=INK;ctx.lineWidth=1.2;
  ctx.fillStyle='rgba(100,170,220,0.1)';
  sketchEllipse(0,0,7,3,true,7000);
  ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(11,-4);ctx.lineTo(11,4);ctx.closePath();ctx.stroke();
  ctx.fillStyle=INK;
  ctx.beginPath();ctx.arc(-2,-0.5,0.8,0,Math.PI*2);ctx.fill();

  // 水泡
  ctx.strokeStyle=INK_L;ctx.lineWidth=0.8;
  const bubY = wobble(f.phase*50, 3, 2);
  ctx.beginPath();ctx.arc(-8, -4+bubY, 1.5, 0, Math.PI*2);ctx.stroke();

  ctx.restore();
}

// ========== AI 行为状态机 ==========
const ai = {
  x: 240, y: 470,
  targetX: 240, targetY: 470,
  expr: 'curious',
  bubble: '这里好像很安全...',
  bubbleTimer: 0,
  state: 'idle',
  stateTimer: 0,
  path: [
    { x:240, y:470, expr:'curious', bubble:'这里好像很安全...', wait:180 },
    { x:190, y:440, expr:'normal', bubble:'', wait:60 },
    { x:180, y:445, expr:'happy', bubble:'发现浆果了！', wait:120 },
    { x:220, y:460, expr:'thinking', bubble:'要不要去森林看看...', wait:150 },
    { x:310, y:400, expr:'curious', bubble:'森林里有什么呢？', wait:120 },
    { x:380, y:360, expr:'normal', bubble:'', wait:60 },
    { x:400, y:380, expr:'thinking', bubble:'好像听到什么声音...', wait:100 },
    { x:500, y:400, expr:'scared', bubble:'那是...狼！？', wait:80 },
    { x:400, y:420, expr:'scared', bubble:'快跑快跑！', wait:60 },
    { x:300, y:460, expr:'determined', bubble:'还好跑掉了...', wait:120 },
    { x:260, y:490, expr:'normal', bubble:'', wait:60 },
    { x:255, y:480, expr:'happy', bubble:'回到家了，安全！', wait:150 },
  ],
  pathIdx: 0,
  waitCounter: 0,
};

function updateAI() {
  const target = ai.path[ai.pathIdx];
  const dx = target.x - ai.x;
  const dy = target.y - ai.y;
  const dist = Math.hypot(dx, dy);

  if (dist > 2) {
    const speed = 0.8;
    ai.x += (dx / dist) * speed;
    ai.y += (dy / dist) * speed;
  } else {
    ai.expr = target.expr;
    ai.bubble = target.bubble;
    ai.waitCounter++;
    if (ai.waitCounter >= target.wait) {
      ai.waitCounter = 0;
      ai.pathIdx = (ai.pathIdx + 1) % ai.path.length;
    }
  }
}

// ========== 思考气泡 ==========
function drawBubble(x, y, text) {
  if (!text) return;

  ctx.strokeStyle=INK;ctx.lineWidth=1.2;
  ctx.fillStyle='rgba(255,255,255,0.88)';

  sketchCircle(x+18,y-14,2,true,9000);
  sketchCircle(x+24,y-22,3,true,9010);

  ctx.font='12px Georgia,serif';
  const tw=ctx.measureText(text).width;
  const bw=tw+24;
  const bx=x+38+bw/2, by=y-36;

  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.beginPath();
  for(let i=0;i<=48;i++){
    const a=(i/48)*Math.PI*2;
    const px=bx+Math.cos(a)*(bw/2+jitS(9020+i,0.8));
    const py=by+Math.sin(a)*(14+jitS(9070+i,0.8));
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=INK;ctx.stroke();

  ctx.fillStyle=INK;
  ctx.font='12px Georgia,serif';
  ctx.textAlign='center';
  ctx.fillText(text,bx,by+4);
  ctx.textAlign='left';
}

// ========== UI ==========
function drawUI() {
  // 天数
  ctx.fillStyle='rgba(255,255,255,0.88)';
  ctx.strokeStyle=INK;ctx.lineWidth=1.2;
  ctx.beginPath();ctx.roundRect(cv.width-130,15,115,35,8);ctx.fill();ctx.stroke();
  ctx.fillStyle=INK;ctx.font='15px Georgia,serif';
  ctx.fillText('☀ 第 1 天',cv.width-118,38);

  // 状态面板
  const px=cv.width-240, py=cv.height-130;
  ctx.fillStyle='rgba(255,255,255,0.9)';ctx.strokeStyle=INK;ctx.lineWidth=1.2;
  ctx.beginPath();ctx.roundRect(px,py,225,115,8);ctx.fill();ctx.stroke();

  ctx.fillStyle=INK;ctx.font='bold 13px Georgia,serif';
  ctx.fillText('AI 状态',px+12,py+22);
  ctx.font='12px Georgia,serif';

  ctx.fillText('生命',px+12,py+44);
  ctx.strokeStyle=INK_L;ctx.lineWidth=1;ctx.strokeRect(px+52,py+34,100,12);
  ctx.fillStyle='rgba(220,80,80,0.4)';ctx.fillRect(px+53,py+35,78,10);
  ctx.fillStyle=INK;ctx.fillText('80%',px+160,py+44);

  ctx.fillText('饥饿',px+12,py+64);
  ctx.strokeStyle=INK_L;ctx.strokeRect(px+52,py+54,100,12);
  ctx.fillStyle='rgba(100,170,80,0.4)';ctx.fillRect(px+53,py+55,55,10);
  ctx.fillStyle=INK;ctx.fillText('55%',px+160,py+64);

  ctx.fillText('背包: 浆果×3  木头×2',px+12,py+84);
  ctx.fillStyle=INK_L;ctx.font='italic 11px Georgia,serif';
  ctx.fillText('💭 '+ai.bubble,px+12,py+104);

  // 表情展示
  ctx.fillStyle='rgba(255,255,255,0.9)';ctx.strokeStyle=INK;ctx.lineWidth=1.2;
  ctx.beginPath();ctx.roundRect(15,15,300,60,8);ctx.fill();ctx.stroke();
  ctx.fillStyle=INK;ctx.font='bold 12px Georgia,serif';
  ctx.fillText('表情',25,42);

  const el=['normal','happy','scared','thinking','curious','determined'];
  const ll=['平静','开心','害怕','思考','好奇','坚定'];
  el.forEach((e,i)=>{
    drawAI(90+i*40,38,e,0.45);
  });
  ctx.font='9px Georgia,serif';ctx.textAlign='center';ctx.fillStyle=INK_L;
  ll.forEach((l,i)=>{ctx.fillText(l,90+i*40,62);});
  ctx.textAlign='left';
}

// ========== 主循环 ==========
drawBgToCache();

const grassPos = [[120,480],[200,550],[80,600],[300,620],[160,400],[50,460],[340,580]];
const treeData = [[350,200,12],[420,160,14],[480,280,11],[380,320,13],[320,280,10],[450,350,12],[520,220,11]];
const rockData = [[750,180,14],[820,250,10],[700,300,12],[870,160,8],[780,350,11]];
const berryData = [[180,450],[250,380],[400,380]];

function frame() {
  time += 0.016;

  // 背景
  ctx.drawImage(bgCache, 0, 0);

  // 草
  grassPos.forEach((g,i)=>drawGrass(g[0],g[1],i*100));

  // 树
  treeData.forEach((t,i)=>drawTree(t[0],t[1],t[2],i*200));

  // 石头
  rockData.forEach((r,i)=>drawRock(r[0],r[1],r[2],i*300));

  // 铁矿点
  ctx.fillStyle='rgba(200,170,80,0.3)';
  ctx.beginPath();ctx.arc(822,248,4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(818,253,3,0,Math.PI*2);ctx.fill();

  // 浆果
  berryData.forEach((b,i)=>drawBerryBush(b[0],b[1],i*400));

  // 建筑
  drawShelter(200,490);
  drawCampfire(260,500);

  // 鱼
  fishes.forEach(f=>{updateFish(f);drawFish(f);});

  // 鹿
  deers.forEach(d=>{updateDeer(d);drawDeer(d);});

  // 兔子
  rabbits.forEach(r=>{updateRabbit(r);drawRabbit(r);});

  // 狼
  wolves.forEach(w=>{updateWolf(w);drawWolf(w);});

  // AI
  updateAI();
  drawAI(ai.x, ai.y, ai.expr, 1);
  drawBubble(ai.x, ai.y, ai.bubble);

  // UI
  drawUI();

  requestAnimationFrame(frame);
}

frame();
